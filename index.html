<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>YUTA Solo Sort</title> <style> :root { --bg: #180609; --surface: #250a0f; --surface2: #310d14; --text: #fff5f6; --muted: #d9aeb5; --line: #5a1d28; --accent: #e53958; --accent2: #ff7187; } * { box-sizing: border-box; } html, body { margin: 0; min-height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; } body { background: radial-gradient(circle at top, #4b101b 0%, var(--bg) 45%); color: var(--text); } #app { min-height: 100vh; padding: 28px 18px 50px; } .wrap { width: min(760px, 100%); margin: auto; } header { text-align: center; margin: 12px 0 28px; } .kicker { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); } h1 { font-family: Georgia, serif; font-size: clamp(38px, 9vw, 60px); line-height: 1; margin: 9px 0; } .subtitle { color: var(--muted); margin: 0; } .card { background: rgba(37, 10, 15, .94); border: 1px solid var(--line); border-radius: 24px; padding: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.35); } .progress { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 12px; } .bar { height: 8px; background: #45131c; border-radius: 99px; overflow: hidden; margin-bottom: 26px; } .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width .25s ease; } .prompt { text-align: center; font-size: 18px; font-weight: 700; margin: 0 0 18px; } .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .choice { min-height: 155px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface2); color: var(--text); padding: 22px 16px; cursor: pointer; font-size: clamp(18px, 4vw, 25px); font-weight: 750; line-height: 1.25; transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease; } .choice:hover { transform: translateY(-4px); border-color: var(--accent2); background: #42121b; box-shadow: 0 12px 30px rgba(229,57,88,.2); } .choice:active { transform: scale(.97); } .help { text-align: center; color: var(--muted); font-size: 12px; margin-top: 15px; } .hidden { display: none !important; } .results h2 { font-family: Georgia, serif; text-align: center; font-size: 36px; margin: 4px 0 8px; } .results p { text-align: center; color: var(--muted); line-height: 1.5; } .rank { display: flex; align-items: center; gap: 13px; padding: 13px 4px; border-bottom: 1px solid var(--line); } .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: #4b131e; color: #ffdce2; flex-shrink: 0; } .rank:first-child .num { background: var(--accent); color: white; } .song { font-weight: 650; flex: 1; } .rating { color: var(--muted); font-size: 12px; } .actions { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; } .secondary { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 10px 17px; cursor: pointer; } .secondary:hover { border-color: var(--accent2); background: #3a0d15; } .note { margin-top: 18px; font-size: 11px; line-height: 1.5; color: var(--muted); text-align: center; } @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } .choice { min-height: 110px; } .card { padding: 17px; } .rating { display: none; } } </style> </head> <body> <div id="app"> <div class="wrap">
<header>
  <div class="kicker">Nakamoto Yuta · 21 songs</div>

  <h1>YUTA Solo Sort</h1>

  <p class="subtitle">
    Choose your favorite song in each matchup.
  </p>
</header>

<section class="card" id="sorter">

  <div class="progress">
    <span id="count">Match 1 of 62</span>
    <span id="percent">0%</span>
  </div>

  <div class="bar">
    <i id="fill"></i>
  </div>

  <p class="prompt">
    Which one do you prefer?
  </p>

  <div class="choices">
    <button class="choice" id="a" type="button"></button>
    <button class="choice" id="b" type="button"></button>
  </div>

  <div class="help">
    Your choices determine your final ranking.
  </div>

</section>

<section class="card results hidden" id="results">

  <h2>Your YUTA ranking</h2>

  <p id="summary"></p>

  <div id="ranking"></div>

  <div class="actions">

    <button class="secondary" id="restart" type="button">
      Sort again
    </button>

    <button class="secondary" id="copy" type="button">
      Copy ranking
    </button>

  </div>

  <div class="note">
    Fan-made sorter. Song titles are used for identification;
    this page does not host audio.
  </div>

</section>

</div> </div> <script> const songs = [ "LAST SONG", "Off The Mask", "Save You", "BAD EUPHORIA", "PRISONER", "Goodbye", "Butterfly (Depth ver.)", "When I’m Not Around", "TWISTED PARADISE", "New World", "EMBER", "Two Of Us", "Get Out Of My Mind", "KNOCK KNOCK", "If We Lose It All Tonight", "Possiboo-hoo", "TO LOVE SOMEONE", "Play Back", "Dreams Never Sleep", "Abyss", "Prayer" ]; const TOTAL_MATCHUPS = 62; let ratings = {}; let matchNumber = 0; let songA = null; let songB = null; const $ = id => document.getElementById(id); /* ------------------------- RANDOM SHUFFLE ------------------------- */ function shuffle(array) { const copy = [...array]; for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; } return copy; } /* ------------------------- START / RESTART ------------------------- */ function start() { ratings = {}; songs.forEach(song => { ratings[song] = 1000; }); matchNumber = 0; songA = null; songB = null; $("sorter").classList.remove("hidden"); $("results").classList.add("hidden"); nextMatch(); } /* ------------------------- PICK NEXT MATCHUP ------------------------- */ function nextMatch() { if (matchNumber >= TOTAL_MATCHUPS) { finish(); return; } /* * Prefer songs with similar ratings. * This makes the later matchups more useful. */ const sorted = [...songs].sort( (a, b) => ratings[a] - ratings[b] ); let candidates = []; for (let attempt = 0; attempt < 20; attempt++) { const firstIndex = Math.floor(Math.random() * songs.length); const firstSong = sorted[firstIndex]; const nearby = sorted.filter((song, index) => { if (song === firstSong) return false; return Math.abs(index - firstIndex) <= 4; }); if (nearby.length > 0) { const secondSong = nearby[Math.floor(Math.random() * nearby.length)]; candidates = [firstSong, secondSong]; break; } } if (candidates.length < 2) { candidates = shuffle(songs).slice(0, 2); } songA = candidates[0]; songB = candidates[1]; $("a").textContent = songA; $("b").textContent = songB; $("count").textContent = `Match ${matchNumber + 1} of ${TOTAL_MATCHUPS}`; const percent = Math.round((matchNumber / TOTAL_MATCHUPS) * 100); $("percent").textContent = percent + "%"; $("fill").style.width = percent + "%"; } /* ------------------------- ELO RATING ------------------------- */ function choose(winner, loser) { const K = 40; const expectedWinner = 1 / ( 1 + Math.pow( 10, (ratings[loser] - ratings[winner]) / 400 ) ); const change = K * (1 - expectedWinner); ratings[winner] += change; ratings[loser] -= change; matchNumber++; nextMatch(); } /* ------------------------- SAFE HTML ------------------------- */ function escapeHtml(text) { return text.replace( /[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character] ); } /* ------------------------- FINAL RANKING ------------------------- */ function finish() { const ranked = [...songs].sort( (a, b) => ratings[b] - ratings[a] ); $("sorter").classList.add("hidden"); $("results").classList.remove("hidden"); $("summary").textContent = `You completed ${TOTAL_MATCHUPS} matchups. Your favorites are ranked from #1 to #21.`; $("ranking").innerHTML = ranked.map((song, index) => { return ` <div class="rank"> <span class="num"> ${index + 1} </span> <span class="song"> ${escapeHtml(song)} </span> <span class="rating"> ${Math.round(ratings[song])} </span> </div> `; }).join(""); $("percent").textContent = "100%"; $("fill").style.width = "100%"; } /* ------------------------- BUTTONS ------------------------- */ $("a").onclick = () => { choose(songA, songB); }; $("b").onclick = () => { choose(songB, songA); }; $("restart").onclick = () => { start(); }; $("copy").onclick = async () => { const rows = [...document.querySelectorAll(".rank")] .map(row => { const number = row.querySelector(".num").textContent.trim(); const song = row.querySelector(".song").textContent.trim(); return `${number}. ${song}`; }) .join("\n"); const text = "My YUTA Solo Sort ranking:\n\n" + rows; try { await navigator.clipboard.writeText(text); $("copy").textContent = "Copied!"; setTimeout(() => { $("copy").textContent = "Copy ranking"; }, 2000); } catch { alert(text); } }; /* ------------------------- START THE SORTER ------------------------- */ start(); </script> </body> </html>
